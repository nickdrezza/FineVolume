name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify tag matches app version
        shell: bash
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "$app_version" = "$expected_version"

      - name: Build universal release package
        run: make package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/FineVolume.zip \
            --title "Fine Volume $version" \
            --generate-notes
